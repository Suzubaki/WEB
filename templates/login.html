{% extends "base.html" %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-box-arrow-in-right"></i> Вход в систему</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Имя пользователя</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-box-arrow-in-right"></i> Войти
                        </button>
                        <div class="text-center mt-2">
                            <small class="text-muted">Для регистрации нового пользователя обратитесь к администратору</small>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="card mt-3">
            <div class="card-body">
                <h5>Тестовые аккаунты:</h5>
                <div class="row">
                    <div class="col-md-6">
                        <strong>Администратор:</strong><br>
                        Логин: <code>admin</code><br>
                        Пароль: <code>admin123</code>
                    </div>
                    <div class="col-md-6">
                        <strong>Ферма 1:</strong><br>
                        Логин: <code>farm1</code><br>
                        Пароль: <code>farm123</code>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
